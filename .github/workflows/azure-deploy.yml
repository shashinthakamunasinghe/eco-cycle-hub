name: Azure App Service - Eco Cycle Hub

on:
  push:
    branches:
      - main
      - feature/bugfix-project

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          # Make sure to add all your Firebase environment variables here
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_APP_NAME: "Eco Cycle Hub"
          NEXT_PUBLIC_APP_VERSION: "0.1.0"
          NODE_ENV: production
          NEXT_PUBLIC_ENV: production
          NEXT_PUBLIC_APP_URL: https://eco-cycle-hub.azurewebsites.net

      - name: Create zip deployment package
        run: |
          mkdir -p deployment
          cp -r .next deployment/.next
          cp -r public deployment/public
          cp package.json deployment/package.json
          cp server.js deployment/server.js
          cp web.config deployment/web.config
          cd deployment
          zip -r ../deployment.zip .

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'eco-cycle-hub'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: './deployment.zip'
